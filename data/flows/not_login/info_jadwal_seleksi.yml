flows:
  info_jadwal_seleksi:
    name: Info Jadwal Seleksi
    description: Ask about admission selection schedule information for new student admission (SPMB)
    steps:
      - action: action_detect_language
      - action: action_info_jadwal_seleksi
        next:
          - if: slots.return_value == "Info Jadwal Seleksi"
            then:
              - action: utter_info_jadwal_seleksi
                next: end_flow
          - else: end_flow
      - id: end_flow
        set_slots:
          - list_menu_not_login: null
        next: go_to_list_menu
      - id: go_to_list_menu
        link: list_menu
