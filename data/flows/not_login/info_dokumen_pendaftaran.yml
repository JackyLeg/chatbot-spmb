flows:
  info_dokumen_pendaftaran:
    name: Info Kelengkapan Dokumen Pendaftaran
    description: Menanyakan tentang kelengkapan dokumen pendaftaran untuk seleksi masuk
    steps:
      - action: action_info_dokumen_pendaftaran
        next:
          - if: slots.return_value == "Info Kelengkapan Dokumen Pendaftaran"
            then:
              - action: utter_info_dokumen_pendaftaran
                next: end_flow
          - else: end_flow
      - id: end_flow
        set_slots:
          - list_menu_not_login: null
        next: go_to_list_menu
      - id: go_to_list_menu
        link: list_menu
