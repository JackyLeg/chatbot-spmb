flows:
  list_menu:
    description: display the menu options of new student admission (SPMB) based on login status
    name: list menu options
    steps:
      - action: action_detect_language
      - action: action_check_login_state
        next:
          - if: slots.login_state == "login"
            then:
              - id: ask_menu_spmb
                collect: list_menu
                utter: utter_ask_list_menu_spmb
                ask_before_filling: true
                description: Request the logged-in user to select an SPMB menu
                next:
                  - if: slots.list_menu == "Pendaftaran" or slots.list_menu == "Admission"
                    then:
                      - link: pendaftaran
                  - if: slots.list_menu == "Kartu Ujian" or slots.list_menu == "Exam Card"
                    then:
                      - link: kartu_ujian
                  - if: slots.list_menu == "Hasil Seleksi" or slots.list_menu == "Selection Results"
                    then:
                      - link: hasil_seleksi
                  - if: slots.list_menu == "Perjanjian" or slots.list_menu == "Agreement"
                    then:
                      - link: perjanjian
                  - if: slots.list_menu == "Pembayaran / Keuangan" or slots.list_menu == "Payment / Finance"
                    then:
                      - link: pembayaran
                  - if: slots.list_menu == "Undur Diri" or slots.list_menu == "Withdrawal"
                    then:
                      - link: undur_diri
                  - if: slots.list_menu == "Pindah Prodi" or slots.list_menu == "Transfer Major"
                    then:
                      - link: pindah_prodi
                  - if: slots.list_menu == "Diskon Alumni" or slots.list_menu == "Alumni Discount"
                    then:
                      - link: diskon_alumni
                  - if: slots.list_menu == "Penyetaraan" or slots.list_menu == "Equivalency"
                    then:
                      - link: penyetaraan
                  - if: slots.list_menu == "Reservasi Pemeriksaan Kesehatan" or slots.list_menu == "Medical Examination Reservation"
                    then:
                      - link: reservasi_kesehatan
                  - else:
                      - action: utter_answer_error_list_menu
                        next: ask_menu_spmb
          - else:
              - id: ask_menu_not_login
                collect: list_menu_not_login
                utter: utter_ask_list_menu_not_login
                ask_before_filling: true
                description: Request the not logged-in user to select an info menu
                next:
                  - if: slots.list_menu_not_login == "Info Jadwal Seleksi" or slots.list_menu_not_login == "Selection Schedule Info"
                    then:
                      - link: info_jadwal_seleksi
                  - if: slots.list_menu_not_login == "Info Skema Keuangan" or slots.list_menu_not_login == "Financial Scheme Info"
                    then:
                      - link: info_skema_keuangan
                  - if: slots.list_menu_not_login == "Info Kelengkapan Dokumen Pendaftaran" or slots.list_menu_not_login == "Application Document Requirements Info"
                    then:
                      - link: info_dokumen_pendaftaran
                  - if: slots.list_menu_not_login == "Info Kelengkapan Dokumen Registrasi" or slots.list_menu_not_login == "Enrollment Document Requirements Info"
                    then:
                      - link: info_dokumen_registrasi
                  - else:
                      - action: utter_answer_error_list_menu
                        next: ask_menu_not_login
