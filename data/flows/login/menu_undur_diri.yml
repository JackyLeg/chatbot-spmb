flows:
  undur_diri:
    name: Undur Diri
    description: Membantu pengguna dengan menu undur diri
    steps:
      - id: ask_menu
        collect: menu_undur_diri
        ask_before_filling: true
        description: |
          Pengguna harus memilih salah satu dari 4 opsi untuk undur diri.
          Opsi yang tersedia: Prosedur Undur Diri, Persyaratan Undur Diri, Transaksi Undur Diri, dan Hasil Undur Diri.
        next: menu_confirmation

      - id: menu_confirmation
        collect: menu_undur_diri_confirmation
        ask_before_filling: true
        next:
          - if: slots.menu_undur_diri_confirmation is false
            then:
              - action: utter_menu_undur_diri_cancelled
                next: ask_menu
          - else: continue_flow

      - id: continue_flow
        action: action_menu_undur_diri
        next:
          - if: slots.return_value = "api_success"
            then: ask_menu
          - if: slots.return_value = "Prosedur Undur Diri"
            then:
              - action: utter_answer_prosedur_undur_diri
                next: ask_menu
          - if: slots.return_value = "Persyaratan Undur Diri"
            then:
              - action: utter_answer_persyaratan_undur_diri
                next: ask_menu
          - if: slots.return_value = "Transaksi Undur Diri"
            then:
              - action: utter_answer_transaksi_undur_diri
                next: ask_menu
          - if: slots.return_value = "Hasil Undur Diri"
            then:
              - action: utter_answer_hasil_undur_diri
                next: ask_menu
          - else:
              - action: utter_answer_error_undur_diri
                next: ask_menu
