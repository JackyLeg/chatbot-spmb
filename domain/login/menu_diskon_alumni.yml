version: "3.1"

actions:
  - action_menu_diskon_alumni

slots:
  menu_diskon_alumni:
    type: categorical
    values:
      - Prosedur Diskon Alumni
      - Persyaratan Diskon Alumni
      - Transaksi Diskon Alumni
      - Hasil Diskon Alumni
      - Alumni Discount Procedure
      - Alumni Discount Requirements
      - Alumni Discount Transaction
      - Alumni Discount Results
    mappings:
      - type: from_llm

  menu_diskon_alumni_confirmation:
    type: bool
    mappings:
      - type: from_llm

# id_login = tracker.get_slot("npm")

responses:
  utter_ask_menu_diskon_alumni:
    - text: "Please select one of the alumni discount options:"
      translation:
        id: "Silakan pilih salah satu opsi diskon alumni:"
      buttons:
        - title: "Alumni Discount Procedure"
          payload: "Alumni Discount Procedure"
          translation:
            id:
              title: "Prosedur Diskon Alumni"
              payload: "Prosedur Diskon Alumni"
        - title: "Alumni Discount Requirements"
          payload: "Alumni Discount Requirements"
          translation:
            id:
              title: "Persyaratan Diskon Alumni"
              payload: "Persyaratan Diskon Alumni"
        - title: "Alumni Discount Transaction"
          payload: "Alumni Discount Transaction"
          translation:
            id:
              title: "Transaksi Diskon Alumni"
              payload: "Transaksi Diskon Alumni"
        - title: "Alumni Discount Results"
          payload: "Alumni Discount Results"
          translation:
            id:
              title: "Hasil Diskon Alumni"
              payload: "Hasil Diskon Alumni"

  utter_ask_menu_diskon_alumni_confirmation:
    - text: "You chose option: {menu_diskon_alumni}. Is this correct?"
      translation:
        id: "Anda memilih opsi: {menu_diskon_alumni}. Apakah ini benar?"
      buttons:
        - title: "Yes"
          payload: "Yes"
          translation:
            id:
              title: "Ya"
              payload: "Ya"
        - title: "No"
          payload: "No"
          translation:
            id:
              title: "Tidak"
              payload: "Tidak"

  utter_menu_diskon_alumni_cancelled:
    - text: "Selection cancelled. Please select an alumni discount option again."
      translation:
        id: "Pilihan dibatalkan. Silakan pilih kembali opsi diskon alumni."

  utter_menu_diskon_alumni_ok:
    - text: "You have selected the alumni discount option: {menu_diskon_alumni}."
      translation:
        id: "Anda telah memilih opsi diskon alumni: {menu_diskon_alumni}."

  utter_answer_prosedur_diskon_alumni:
    - text: |
        TUITION SPP DISCOUNT APPLICATION PROCEDURE (EARLY PAYMENT)
        1. Complete your tuition fee payment as a lump sum (Package A) according to the invoice in your SPMB account.
        2. The SPP discount will be calculated automatically by the financial system based on the payment date.
        3. Pay before May 31, 2026, to receive a 10% SPP discount (FKG receives a 5% discount), or between June 1 and August 31, 2026, to receive a 5% discount (except FK & FKG).
      translation:
        id: |
          PROSEDUR DISKON/POTONGAN SPP (PEMBAYARAN AWAL)
          1. Lakukan pembayaran biaya kuliah lunas sekaligus (Paket A) sesuai tagihan di akun SPMB.
          2. Potongan SPP akan dihitung secara otomatis oleh sistem keuangan berdasarkan tanggal pembayaran.
          3. Bayar sebelum 31 Mei 2026 untuk mendapat potongan SPP 10% (FKG potongan 5%), atau antara 1 Juni s.d. 31 Agustus 2026 untuk mendapat potongan 5% (kecuali FK & FKG).

  utter_answer_persyaratan_diskon_alumni:
    - text: |
        TUITION SPP DISCOUNT REQUIREMENTS
        1. Choose Package A (100% full payment as lump sum).
        2. Payment settled no later than May 31, 2026 (10% discount, 5% for FKG) or between June 1 and August 31, 2026 (5% discount, not applicable for FK & FKG).
        3. Applicable for Bachelor (Sarjana) and Diploma programs.
      translation:
        id: |
          PERSYARATAN DISKON/POTONGAN SPP
          1. Memilih Paket A (pembayaran lunas sekaligus 100% sesuai periode diterima).
          2. Pembayaran diselesaikan paling lambat tanggal 31 Mei 2026 (potongan 10%, FKG 5%) atau antara 1 Juni s.d. 31 Agustus 2026 (potongan 5%, tidak berlaku untuk FK & FKG).
          3. Berlaku untuk program Sarjana dan Diploma.

  utter_answer_transaksi_diskon_alumni:
    - text: "Please submit your alumni family proof documents for discount verification."
      translation:
        id: "Silakan kirimkan dokumen bukti kekeluargaan alumni Anda untuk kami verifikasi potongan biaya."

  utter_answer_hasil_diskon_alumni:
    - text: "Your alumni path tuition fee discount application is currently being verified by the financial bureau."
      translation:
        id: "Pengajuan diskon biaya pendidikan jalur alumni Anda sedang diverifikasi oleh biro keuangan."

  utter_answer_error_diskon_alumni:
    - text: "Sorry, an error occurred in the alumni discount menu. Please try again."
      translation:
        id: "Maaf, terjadi kesalahan pada menu diskon alumni. Silakan coba lagi."
