version: "3.1"

actions:
  - action_menu_pembayaran

slots:
  menu_pembayaran:
    type: categorical
    values:
      - Prosedur Pembayaran
      - Persyaratan Pembayaran
      - Transaksi Pembayaran
      - Hasil Pembayaran
      - Payment Procedure
      - Payment Requirements
      - Payment Transaction
      - Payment Status
    mappings:
      - type: from_llm

  menu_pembayaran_confirmation:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_menu_pembayaran:
    - text: "Please select one of the payment / finance options:"
      translation:
        id: "Silakan pilih salah satu opsi pembayaran / keuangan:"
      buttons:
        - title: "Payment Procedure"
          payload: "Payment Procedure"
          translation:
            id:
              title: "Prosedur Pembayaran"
              payload: "Prosedur Pembayaran"
        - title: "Payment Requirements"
          payload: "Payment Requirements"
          translation:
            id:
              title: "Persyaratan Pembayaran"
              payload: "Persyaratan Pembayaran"
        - title: "Payment Transaction"
          payload: "Payment Transaction"
          translation:
            id:
              title: "Transaksi Pembayaran"
              payload: "Transaksi Pembayaran"
        - title: "Payment Status"
          payload: "Payment Status"
          translation:
            id:
              title: "Hasil Pembayaran"
              payload: "Hasil Pembayaran"

  utter_ask_menu_pembayaran_confirmation:
    - text: "You chose option: {menu_pembayaran}. Is this correct?"
      translation:
        id: "Anda memilih opsi: {menu_pembayaran}. Apakah ini benar?"
      buttons:
        - title: "Yes"
          payload: "Yes"
          translation:
            id:
              title: "Ya"
              payload: "Ya"
        - title: "No"
          payload: "No"
          translation:
            id:
              title: "Tidak"
              payload: "Tidak"

  utter_menu_pembayaran_cancelled:
    - text: "Selection cancelled. Please select a payment option again."
      translation:
        id: "Pilihan dibatalkan. Silakan pilih kembali opsi pembayaran."

  utter_menu_pembayaran_ok:
    - text: "You have selected the payment option: {menu_pembayaran}."
      translation:
        id: "Anda telah memilih opsi pembayaran: {menu_pembayaran}."

  utter_answer_prosedur_pembayaran:
    - text: |
        TUITION FEE / REGISTRATION PAYMENT PROCEDURE
        1. Log in to the SPMB Trisakti portal to view your education fee details and BNI Virtual Account (VA) number under the "Status Keuangan" menu, "Payment" tab.
        2. Pay the tuition fees by transferring to the designated Bank BNI VA number.
        3. Prospective students can choose a payment package: Package A (100% full payment) or Package B (3 or 4 installments in accordance with Rector's Regulation No. 32/2025).
        4. All components of tuition fees must be fully settled before participating in the Odd Semester Final Exam (UAS).
      translation:
        id: |
          PROSEDUR PEMBAYARAN BIAYA PENDIDIKAN / REGISTRASI
          1. Login ke portal SPMB Trisakti untuk melihat rincian biaya pendidikan dan nomor Virtual Account (VA) Bank BNI pada menu "Status Keuangan" tab "Payment".
          2. Pembayaran biaya pendidikan dilakukan melalui transfer bank ke VA Bank BNI yang tertera.
          3. Calon mahasiswa dapat memilih salah satu paket pembayaran: Paket A (pembayaran lunas sekaligus 100%) atau Paket B (diangsur 3 atau 4 kali sesuai Peraturan Rektor No. 32 Tahun 2025).
          4. Pelunasan seluruh komponen biaya pendidikan harus diselesaikan sebelum mengikuti Ujian Akhir Semester (UAS) Semester Gasal.

  utter_answer_persyaratan_pembayaran:
    - text: |
        TUITION FEE PAYMENT REQUIREMENTS
        1. Have an official BNI Virtual Account number generated in your SPMB account.
        2. Make payment for the exact amount shown on your financial details.
        3. Pay the Student Health Service (LKM) fee of IDR 60,000 per semester.
        4. For foreign citizens (WNA), the tuition fee is 1 to 1.5 times the fee for Indonesian citizens (WNI).
        5. SPP Discount (Early Payment):
            - 10% SPP discount if choosing Package A and paid by May 31, 2026 (FKG discount is 5%).
            - 5% SPP discount if paid between June 1 and August 31, 2026 (except FK and FKG).
      translation:
        id: |
          PERSYARATAN PEMBAYARAN BIAYA KULIAH
          1. Memiliki nomor BNI Virtual Account resmi yang terbit di akun SPMB masing-masing.
          2. Membayar sesuai tagihan yang tertera pada skema keuangan.
          3. Membayar Biaya Layanan Kesehatan Mahasiswa (LKM) sebesar Rp60.000 per semester.
          4. Bagi WNA, biaya pendidikan dikenakan tarif 1 s.d. 1,5 kali biaya pendidikan WNI.
          5. Diskon/Potongan SPP (Pembayaran Awal):
              - Potongan SPP 10% jika memilih Paket A dan membayar paling lambat 31 Mei 2026 (potongan SPP FKG adalah 5%).
              - Potongan SPP 5% jika membayar dari tanggal 1 Juni s.d. 31 Agustus 2026 (kecuali FK dan FKG).

  utter_answer_transaksi_pembayaran:
    - text: "Please make your tuition fee payment via the Virtual Account listed in the portal."
      translation:
        id: "Silakan lakukan pembayaran biaya pendidikan Anda melalui Virtual Account yang tertera di portal."

  utter_answer_hasil_pembayaran:
    - text: "Your payment has been received and verified by the Universitas Trisakti financial system."
      translation:
        id: "Pembayaran Anda telah diterima dan diverifikasi oleh sistem keuangan Universitas Trisakti."

  utter_answer_error_pembayaran:
    - text: "Sorry, an error occurred in the payment menu. Please try again."
      translation:
        id: "Maaf, terjadi kesalahan pada menu pembayaran. Silakan coba lagi."
