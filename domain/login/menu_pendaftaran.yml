version: "3.1"

actions:
  - action_menu_pendaftaran

slots:
  menu_pendaftaran:
    type: categorical
    values:
      - Prosedur Pendaftaran
      - Persyaratan Pendaftaran
      - Transaksi Pendaftaran
      - Hasil Pendaftaran
      - Admission Procedure
      - Admission Requirements
      - Admission Transaction
      - Admission Status
    mappings:
      - type: from_llm

  menu_pendaftaran_confirmation:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_menu_pendaftaran:
    - text: "Please select one of the admission options:"
      translation:
        id: "Silakan pilih salah satu opsi pendaftaran:"
      buttons:
        - title: "Admission Procedure"
          payload: "Admission Procedure"
          translation:
            id:
              title: "Prosedur Pendaftaran"
              payload: "Prosedur Pendaftaran"
        - title: "Admission Requirements"
          payload: "Admission Requirements"
          translation:
            id:
              title: "Persyaratan Pendaftaran"
              payload: "Persyaratan Pendaftaran"
        - title: "Admission Transaction"
          payload: "Admission Transaction"
          translation:
            id:
              title: "Transaksi Pendaftaran"
              payload: "Transaksi Pendaftaran"
        - title: "Admission Status"
          payload: "Admission Status"
          translation:
            id:
              title: "Hasil Pendaftaran"
              payload: "Hasil Pendaftaran"

  utter_ask_menu_pendaftaran_confirmation:
    - text: "You chose option: {menu_pendaftaran}. Is this correct?"
      translation:
        id: "Anda memilih opsi: {menu_pendaftaran}. Apakah ini benar?"
      buttons:
        - title: "Yes"
          payload: "Yes"
          translation:
            id:
              title: "Ya"
              payload: "Ya"
        - title: "No"
          payload: "No"
          translation:
            id:
              title: "Tidak"
              payload: "Tidak"

  utter_menu_pendaftaran_cancelled:
    - text: "Selection cancelled. Please select an admission option again."
      translation:
        id: "Pilihan dibatalkan. Silakan pilih kembali opsi pendaftaran."

  utter_menu_pendaftaran_ok:
    - text: "You have selected the admission option: {menu_pendaftaran}."
      translation:
        id: "Anda telah memilih opsi pendaftaran: {menu_pendaftaran}."

  utter_answer_prosedur_pendaftaran:
    - text: |
        UNIVERSITAS TRISAKTI SPMB ADMISSION PROCEDURE
        1. Registration is done online via the portal https://spmb.trisakti.ac.id/ or https://spmb.trisakti.ac.id/landingpage.
        2. Click "Register Now" or select the "Login" menu to create a new account.
        3. Check your registered email and click "Confirm Account" to activate.
        4. Log back in to the portal, then complete personal details, contact info, study program, and selection path on the dashboard.
        5. Upload required documents (based on the chosen pathway) and confirm if all data is correct.
        6. Candidates can download the registration proof as a prospective new student of Universitas Trisakti.
      translation:
        id: |
          PROSEDUR PENDAFTARAN SPMB UNIVERSITAS TRISAKTI
          1. Pendaftaran dilakukan secara daring (online) melalui portal https://spmb.trisakti.ac.id/ atau https://spmb.trisakti.ac.id/landingpage.
          2. Klik "Daftar Sekarang" atau pilih menu "Login" untuk membuat akun baru.
          3. Cek email terdaftar dan klik "Confirm Account" untuk mengaktifkan akun.
          4. Login kembali ke portal, lalu isi data personal, info kontak, program studi, dan jalur seleksi pada dashboard.
          5. Unggah dokumen persyaratan (sesuai jalur seleksi yang dipilih) dan lakukan konfirmasi jika data sudah benar.
          6. Calon mahasiswa dapat mengunduh bukti pendaftaran sebagai calon mahasiswa baru Universitas Trisakti.

  utter_answer_persyaratan_pendaftaran:
    - text: |
        ADMISSION REQUIREMENTS
        1. Scanned color copy of identity card (KTP/Student Card).
        2. Latest color photograph (4x6 cm size with white background).
        3. Non-Color-Blind Certificate from doctor at Klinik Pratama UPM (Usakti Prima Medika), Puskesmas, Clinic, or Hospital for applicants of specific programs (FK, FKG, FSRD, FTKE, FALTL, FTSP, and FTI [Mechanical Engineering, Electrical Engineering, Industrial Engineering]).
        4. Match the high school/vocational school major requirements for the target study program.
      translation:
        id: |
          PERSYARATAN PENDAFTARAN SPMB
          1. Pindaian kartu identitas (KTP/Kartu Pelajar) berwarna.
          2. Pas foto terbaru berukuran 4x6 cm dengan latar belakang berwarna putih.
          3. Surat Keterangan Tidak Buta Warna dari dokter Klinik Pratama UPM (Usakti Prima Medika), Puskesmas, Klinik Utama, atau Rumah Sakit bagi pendaftar program studi tertentu (FK, FKG, FSRD, FTKE, FALTL, FTSP, dan FTI [Teknik Mesin, Teknik Elektro, Teknik Industri]).
          4. Memenuhi syarat latar belakang jurusan SMA/SMK/sederajat yang sesuai dengan program studi tujuan.

  utter_answer_transaksi_pendaftaran:
    - text: "Please complete your admission form entries and submit your registration documents."
      translation:
        id: "Silakan selesaikan pengisian formulir pendaftaran dan kirimkan berkas pendaftaran Anda."

  utter_answer_hasil_pendaftaran:
    - text: "The verification status of your registration documents is currently being processed by the SPMB team."
      translation:
        id: "Status verifikasi berkas pendaftaran Anda sedang diproses oleh tim SPMB."

  utter_answer_error_pendaftaran:
    - text: "Sorry, an error occurred in the admission menu. Please try again."
      translation:
        id: "Maaf, terjadi kesalahan pada menu pendaftaran. Silakan coba lagi."
