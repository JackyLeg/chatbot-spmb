version: "3.1"

actions:
  - action_menu_pindah_prodi

slots:
  menu_pindah_prodi:
    type: categorical
    values:
      - Prosedur Pindah Prodi
      - Persyaratan Pindah Prodi
      - Transaksi Pindah Prodi
      - Hasil Pindah Prodi
      - Transfer Major Procedure
      - Transfer Major Requirements
      - Transfer Major Transaction
      - Transfer Major Status
    mappings:
      - type: from_llm

  menu_pindah_prodi_confirmation:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_menu_pindah_prodi:
    - text: "Please select one of the transfer major options:"
      translation:
        id: "Silakan pilih salah satu opsi pindah prodi:"
      buttons:
        - title: "Transfer Major Procedure"
          payload: "Transfer Major Procedure"
          translation:
            id:
              title: "Prosedur Pindah Prodi"
              payload: "Prosedur Pindah Prodi"
        - title: "Transfer Major Requirements"
          payload: "Transfer Major Requirements"
          translation:
            id:
              title: "Persyaratan Pindah Prodi"
              payload: "Persyaratan Pindah Prodi"
        - title: "Transfer Major Transaction"
          payload: "Transfer Major Transaction"
          translation:
            id:
              title: "Transaksi Pindah Prodi"
              payload: "Transaksi Pindah Prodi"
        - title: "Transfer Major Status"
          payload: "Transfer Major Status"
          translation:
            id:
              title: "Hasil Pindah Prodi"
              payload: "Hasil Pindah Prodi"

  utter_ask_menu_pindah_prodi_confirmation:
    - text: "You chose option: {menu_pindah_prodi}. Is this correct?"
      translation:
        id: "Anda memilih opsi: {menu_pindah_prodi}. Apakah ini benar?"
      buttons:
        - title: "Yes"
          payload: "Yes"
          translation:
            id:
              title: "Ya"
              payload: "Ya"
        - title: "No"
          payload: "No"
          translation:
            id:
              title: "Tidak"
              payload: "Tidak"

  utter_menu_pindah_prodi_cancelled:
    - text: "Selection cancelled. Please select a transfer major option again."
      translation:
        id: "Pilihan dibatalkan. Silakan pilih kembali opsi pindah prodi."

  utter_menu_pindah_prodi_ok:
    - text: "You have selected the transfer major option: {menu_pindah_prodi}."
      translation:
        id: "Anda telah memilih opsi pindah prodi: {menu_pindah_prodi}."

  utter_answer_prosedur_pindah_prodi:
    - text: |
        STUDY PROGRAM TRANSFER PROCEDURE
        1. Students register for transfer across study programs within one Faculty or between Faculties (Internal Transfer path).
        2. Register the application via https://spmb.trisakti.ac.id/ and pay the selection/transfer fee of IDR 750,000.
        3. Fill in the transfer application form and upload administrative supporting documents (transcripts, origin program accreditation, and active PDDikti proof).
        4. Transfers across study programs within one Faculty are processed according to Faculty regulations. Inter-Faculty transfers are approved by Rector's Decision based on Deans' recommendations.
      translation:
        id: |
          PROSEDUR PINDAH PROGRAM STUDI
          1. Mahasiswa mendaftar perpindahan lintas program studi dalam satu Fakultas atau antar Fakultas (jalur Pindahan Internal).
          2. Daftarkan permohonan melalui https://spmb.trisakti.ac.id/ dan bayar biaya seleksi/pindahan sebesar Rp750.000.
          3. Isi formulir permohonan transfer dan unggah berkas administrasi pendukung (transkrip nilai, akreditasi prodi asal, dan bukti aktif PDDikti).
          4. Perpindahan lintas prodi satu fakultas diproses sesuai ketentuan Fakultas. Perpindahan antar Fakultas disahkan Keputusan Rektor atas pertimbangan Dekan terkait.

  utter_answer_persyaratan_pindah_prodi:
    - text: |
        TRANSFER MAJOR REQUIREMENTS
        1. Active status and registered on PDDikti (https://pddikti.kemdiktisaintek.go.id).
        2. Studied in the origin program for no more than 5 semesters (specifically Faculty of Law no more than 3 semesters) and not drop out (DO).
        3. Has studied for at least 2 semesters with a minimum GPA of 2.50.
        4. Faculty of Medicine (FK) and Faculty of Dentistry (FKG) do not accept transfer students.
      translation:
        id: |
          PERSYARATAN PINDAH PRODI
          1. Berstatus aktif dan terdaftar di PDDikti (https://pddikti.kemdiktisaintek.go.id).
          2. Kuliah di prodi asal tidak lebih dari 5 semester (khusus Fakultas Hukum tidak lebih dari 3 semester) dan tidak putus studi/drop out (DO).
          3. Menjalani kuliah minimal 2 semester dengan IPK minimal 2,50.
          4. Fakultas Kedokteran (FK) dan Fakultas Kedokteran Gigi (FKG) tidak menerima mahasiswa pindahan.

  utter_answer_transaksi_pindah_prodi:
    - text: "Please submit your study program transfer application form for verification."
      translation:
        id: "Silakan kirimkan formulir permohonan pindah program studi Anda untuk kami verifikasi."

  utter_answer_hasil_pindah_prodi:
    - text: "Your program transfer request is currently being processed by the SPMB committee."
      translation:
        id: "Permohonan perpindahan program studi Anda sedang diproses oleh tim panitia SPMB."

  utter_answer_error_pindah_prodi:
    - text: "Sorry, an error occurred in the transfer major menu. Please try again."
      translation:
        id: "Maaf, terjadi kesalahan pada menu pindah prodi. Silakan coba lagi."
