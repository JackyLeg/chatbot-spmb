version: "3.1"

actions:
  - action_menu_perjanjian

slots:
  menu_perjanjian:
    type: categorical
    values:
      - Prosedur Perjanjian
      - Persyaratan Perjanjian
      - Transaksi Perjanjian
      - Hasil Perjanjian
      - Agreement Procedure
      - Agreement Requirements
      - Agreement Transaction
      - Agreement Status
    mappings:
      - type: from_llm

  menu_perjanjian_confirmation:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_menu_perjanjian:
    - text: "Please select one of the agreement options:"
      translation:
        id: "Silakan pilih salah satu opsi perjanjian:"
      buttons:
        - title: "Agreement Procedure"
          payload: "Agreement Procedure"
          translation:
            id:
              title: "Prosedur Perjanjian"
              payload: "Prosedur Perjanjian"
        - title: "Agreement Requirements"
          payload: "Agreement Requirements"
          translation:
            id:
              title: "Persyaratan Perjanjian"
              payload: "Persyaratan Perjanjian"
        - title: "Agreement Transaction"
          payload: "Agreement Transaction"
          translation:
            id:
              title: "Transaksi Perjanjian"
              payload: "Transaksi Perjanjian"
        - title: "Agreement Status"
          payload: "Agreement Status"
          translation:
            id:
              title: "Hasil Perjanjian"
              payload: "Hasil Perjanjian"

  utter_ask_menu_perjanjian_confirmation:
    - text: "You chose option: {menu_perjanjian}. Is this correct?"
      translation:
        id: "Anda memilih opsi: {menu_perjanjian}. Apakah ini benar?"
      buttons:
        - title: "Yes"
          payload: "Yes"
          translation:
            id:
              title: "Ya"
              payload: "Ya"
        - title: "No"
          payload: "No"
          translation:
            id:
              title: "Tidak"
              payload: "Tidak"

  utter_menu_perjanjian_cancelled:
    - text: "Selection cancelled. Please select an agreement option again."
      translation:
        id: "Pilihan dibatalkan. Silakan pilih kembali opsi perjanjian."

  utter_menu_perjanjian_ok:
    - text: "You have selected the agreement option: {menu_perjanjian}."
      translation:
        id: "Anda telah memilih opsi perjanjian: {menu_perjanjian}."

  utter_answer_prosedur_perjanjian:
    - text: |
        NEW STUDENT AGREEMENT SIGNING PROCEDURE
        1. Log in to the SPMB Trisakti portal and download the New Student Agreement Letter draft.
        2. Print the agreement letter draft physically.
        3. Read, understand, and sign the agreement letter on a Rp10,000 stamp duty (meterai) along with your Parent/Guardian (wet signatures).
        4. Upload the scanned color copy of the signed agreement letter to the SPMB portal under the Registration Completeness menu.
      translation:
        id: |
          PROSEDUR PENANDATANGANAN PERJANJIAN MAHASISWA BARU
          1. Login ke portal SPMB Trisakti dan unduh draf Surat Perjanjian Mahasiswa Baru.
          2. Cetak draf surat perjanjian tersebut secara fisik.
          3. Baca, pahami, dan tanda tangani surat perjanjian di atas meterai Rp10.000 bersama dengan Orang Tua/Wali (tanda tangan basah).
          4. Unggah hasil pindaian berwarna (scan) surat perjanjian yang telah ditandatangani tersebut ke portal SPMB menu Kelengkapan Registrasi.

  utter_answer_persyaratan_perjanjian:
    - text: |
        AGREEMENT DOCUMENT REQUIREMENTS
        1. Official draft of the New Student Agreement Letter printed from the SPMB portal.
        2. One Rp10,000 stamp duty (meterai).
        3. Wet signatures of both the candidate and parent/guardian on the stamp duty.
        4. Must be uploaded by all admission pathways (USM, PSSB, UTBK, Portfolio, Scholarship, Transfer/RPL) no later than August 20, 2026.
      translation:
        id: |
          PERSYARATAN DOKUMEN PERJANJIAN
          1. Draf Surat Perjanjian Mahasiswa Baru resmi yang dicetak dari portal SPMB.
          2. Meterai Rp10.000 sebanyak 1 (satu) buah.
          3. Tanda tangan basah calon mahasiswa dan orang tua/wali di atas meterai.
          4. Wajib diunggah oleh semua jalur penerimaan (USM, PSSB, UTBK, Portofolio, Beasiswa, Pindahan/RPL) paling lambat 20 Agustus 2026.

  utter_answer_transaksi_perjanjian:
    - text: "Please upload the signed new student agreement document on the stamp duty."
      translation:
        id: "Silakan unggah dokumen perjanjian mahasiswa baru yang telah ditandatangani di atas meterai."

  utter_answer_hasil_perjanjian:
    - text: "Your agreement document has been uploaded and is currently under admin verification."
      translation:
        id: "Dokumen perjanjian Anda telah diunggah dan sedang dalam tahap verifikasi admin."

  utter_answer_error_perjanjian:
    - text: "Sorry, an error occurred in the agreement menu. Please try again."
      translation:
        id: "Maaf, terjadi kesalahan pada menu perjanjian. Silakan coba lagi."
