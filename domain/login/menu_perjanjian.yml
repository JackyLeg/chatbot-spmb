version: "3.1"

actions:
  - action_menu_perjanjian

slots:
  menu_perjanjian:
    type: categorical
    values:
      - Prosedur Perjanjian
      - Persyaratan Perjanjian
      - Transaksi Perjanjian
      - Hasil Perjanjian
    mappings:
      - type: from_llm

  menu_perjanjian_confirmation:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_menu_perjanjian:
    - text: "Silakan pilih salah satu opsi perjanjian:"
      buttons:
        - title: "Prosedur Perjanjian"
          payload: "Prosedur Perjanjian"
        - title: "Persyaratan Perjanjian"
          payload: "Persyaratan Perjanjian"
        - title: "Transaksi Perjanjian"
          payload: "Transaksi Perjanjian"
        - title: "Hasil Perjanjian"
          payload: "Hasil Perjanjian"

  utter_ask_menu_perjanjian_confirmation:
    - text: "Anda memilih opsi: {menu_perjanjian}. Apakah ini benar?"
      buttons:
        - title: "Ya"
          payload: "Ya"
        - title: "Tidak"
          payload: "Tidak"

  utter_menu_perjanjian_cancelled:
    - text: "Pilihan dibatalkan. Silakan pilih kembali opsi perjanjian."

  utter_menu_perjanjian_ok:
    - text: "Anda telah memilih opsi perjanjian: {menu_perjanjian}."

  utter_answer_prosedur_perjanjian:
    - text: |
        PROSEDUR PENANDATANGANAN PERJANJIAN MAHASISWA BARU
        1. Login ke portal SPMB Trisakti.
        2. Unduh draf Surat Perjanjian Mahasiswa Baru dari dashboard Anda.
        3. Baca dan pahami hak serta kewajiban sebagai calon mahasiswa baru Universitas Trisakti.
        4. Tanda tangani dokumen di atas meterai Rp10.000 bersama dengan Orang Tua/Wali.
        5. Unggah kembali berkas scan surat perjanjian yang telah ditandatangani.

  utter_answer_persyaratan_perjanjian:
    - text: |
        PERSYARATAN DOKUMEN PERJANJIAN
        1. Telah dinyatakan lulus seleksi masuk Universitas Trisakti.
        2. Surat Perjanjian Mahasiswa Baru asli yang dicetak dari portal.
        3. Meterai Rp10.000 (1 buah).
        4. Tanda tangan basah mahasiswa dan orang tua/wali mahasiswa.

  utter_answer_transaksi_perjanjian:
    - text: "Silakan unggah dokumen perjanjian mahasiswa baru yang telah ditandatangani di atas meterai."

  utter_answer_hasil_perjanjian:
    - text: "Dokumen perjanjian Anda telah diunggah dan sedang dalam tahap verifikasi admin."

  utter_answer_error_perjanjian:
    - text: "Maaf, terjadi kesalahan pada menu perjanjian. Silakan coba lagi."
