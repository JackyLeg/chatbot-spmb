version: "3.1"

actions:
  - action_menu_undur_diri

slots:
  menu_undur_diri:
    type: categorical
    values:
      - Prosedur Undur Diri
      - Persyaratan Undur Diri
      - Transaksi Undur Diri
      - Hasil Undur Diri
      - Withdrawal Procedure
      - Withdrawal Requirements
      - Withdrawal Transaction
      - Withdrawal Status
    mappings:
      - type: from_llm

  menu_undur_diri_confirmation:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_menu_undur_diri:
    - text: "Please select one of the withdrawal options:"
      translation:
        id: "Silakan pilih salah satu opsi undur diri:"
      buttons:
        - title: "Withdrawal Procedure"
          payload: "Withdrawal Procedure"
          translation:
            id:
              title: "Prosedur Undur Diri"
              payload: "Prosedur Undur Diri"
        - title: "Withdrawal Requirements"
          payload: "Withdrawal Requirements"
          translation:
            id:
              title: "Persyaratan Undur Diri"
              payload: "Persyaratan Undur Diri"
        - title: "Withdrawal Transaction"
          payload: "Withdrawal Transaction"
          translation:
            id:
              title: "Transaksi Undur Diri"
              payload: "Transaksi Undur Diri"
        - title: "Withdrawal Status"
          payload: "Withdrawal Status"
          translation:
            id:
              title: "Hasil Undur Diri"
              payload: "Hasil Undur Diri"

  utter_ask_menu_undur_diri_confirmation:
    - text: "You chose option: {menu_undur_diri}. Is this correct?"
      translation:
        id: "Anda memilih opsi: {menu_undur_diri}. Apakah ini benar?"
      buttons:
        - title: "Yes"
          payload: "Yes"
          translation:
            id:
              title: "Ya"
              payload: "Ya"
        - title: "No"
          payload: "No"
          translation:
            id:
              title: "Tidak"
              payload: "Tidak"

  utter_menu_undur_diri_cancelled:
    - text: "Selection cancelled. Please select a withdrawal option again."
      translation:
        id: "Pilihan dibatalkan. Silakan pilih kembali opsi undur diri."

  utter_menu_undur_diri_ok:
    - text: "You have selected the withdrawal option: {menu_undur_diri}."
      translation:
        id: "Anda telah memilih opsi undur diri: {menu_undur_diri}."

  utter_answer_prosedur_undur_diri:
    - text: |
        PROSPECTIVE NEW STUDENT WITHDRAWAL PROCEDURE
        1. Calon student submits a formal, written withdrawal request to the SPMB committee.
        2. Fill out the withdrawal application form available in the SPMB portal.
        3. Upload the stamp duty (meterai) signed request letter, receipt of payment, and copy of ID card (KTP/KK).
        4. The tuition fee refund process (subject to prevailing refund terms) requires a maximum of 14 working days of verification.
      translation:
        id: |
          PROSEDUR UNDUR DIRI CALON MAHASISWA BARU
          1. Calon mahasiswa mengajukan permohonan undur diri resmi secara tertulis ke panitia SPMB.
          2. Isi formulir pengajuan undur diri yang tersedia di portal SPMB.
          3. Unggah surat permohonan bermeterai, bukti tanda terima pembayaran, dan fotokopi KTP/KK.
          4. Proses pengembalian biaya pendidikan (sesuai ketentuan pengembalian yang berlaku) membutuhkan waktu verifikasi maksimal 14 hari kerja.

  utter_answer_persyaratan_undur_diri:
    - text: |
        WITHDRAWAL REQUIREMENTS
        1. A Withdrawal Application Letter signed by the student and parent on a Rp10,000 stamp duty (meterai).
        2. Attach a letter of proof of acceptance at a State University (PTN) via SNBP/SNBT path (if withdrawing because of acceptance at a PTN).
        3. Receipt or original proof of tuition payment made to Universitas Trisakti.
      translation:
        id: |
          PERSYARATAN UNDUR DIRI
          1. Surat Permohonan Undur Diri yang ditandatangani mahasiswa dan orang itu di atas meterai Rp10.000.
          2. Melampirkan surat bukti kelulusan di Perguruan Tinggi Negeri (PTN) jalur SNBP/SNBT (jika mengundurkan diri karena diterima di PTN).
          3. Kwitansi atau bukti pembayaran biaya kuliah asli yang telah dilakukan ke Universitas Trisakti.

  utter_answer_transaksi_undur_diri:
    - text: "Please complete the documents and form for your withdrawal application so we can process it."
      translation:
        id: "Silakan lengkapi berkas dan formulir pengajuan undur diri Anda untuk kami proses."

  utter_answer_hasil_undur_diri:
    - text: "Your withdrawal application is currently being processed by academic administration."
      translation:
        id: "Permohonan pengunduran diri Anda sedang diproses oleh admin akademik."

  utter_answer_error_undur_diri:
    - text: "Sorry, an error occurred in the withdrawal menu. Please try again."
      translation:
        id: "Maaf, terjadi kesalahan pada menu undur diri. Silakan coba lagi."
