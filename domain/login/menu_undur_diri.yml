      - Persyaratan Undur Diri
      - Transaksi Undur Diri
      - Hasil Undur Diri
      - Withdrawal Procedure
      - Withdrawal Requirements
      - Withdrawal Transaction
      - Withdrawal Status
    mappings:
      - type: from_llm

  menu_undur_diri_confirmation:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_menu_undur_diri:
    - text: "Please select one of the withdrawal options:"
      translation:
        id: "Silakan pilih salah satu opsi undur diri:"
      buttons:
        - title: "Withdrawal Procedure"
          payload: "Withdrawal Procedure"
          translation:
            id:
              title: "Prosedur Undur Diri"
              payload: "Prosedur Undur Diri"
        - title: "Withdrawal Requirements"
          payload: "Withdrawal Requirements"
          translation:
            id:
              title: "Persyaratan Undur Diri"
              payload: "Persyaratan Undur Diri"
        - title: "Withdrawal Transaction"
          payload: "Withdrawal Transaction"
          translation:
            id:
              title: "Transaksi Undur Diri"
              payload: "Transaksi Undur Diri"
        - title: "Withdrawal Status"
          payload: "Withdrawal Status"
          translation:
            id:
              title: "Hasil Undur Diri"
              payload: "Hasil Undur Diri"

  utter_ask_menu_undur_diri_confirmation:
    - text: "You chose option: {menu_undur_diri}. Is this correct?"
      translation:
        id: "Anda memilih opsi: {menu_undur_diri}. Apakah ini benar?"
      buttons:
        - title: "Yes"
          payload: "Yes"
          translation:
            id:
              title: "Ya"
              payload: "Ya"
        - title: "No"
          payload: "No"
          translation:
            id:
              title: "Tidak"
              payload: "Tidak"

  utter_menu_undur_diri_cancelled:
    - text: "Selection cancelled. Please select a withdrawal option again."
      translation:
        id: "Pilihan dibatalkan. Silakan pilih kembali opsi undur diri."

  utter_menu_undur_diri_ok:
    - text: "You have selected the withdrawal option: {menu_undur_diri}."
      translation:
        id: "Anda telah memilih opsi undur diri: {menu_undur_diri}."

  utter_answer_prosedur_undur_diri:
    - text: |
        NEW STUDENT WITHDRAWAL PROCEDURE
        1. Log in to the SPMB Trisakti portal.
        2. Select the "Status Keuangan" menu and press the "Payment" tab to check payments made.
        3. Select the "Undur Diri" menu.
        4. Select the study program to withdraw from, then click the "Apply Quit" button.
        5. Fill in the refund bank account details, complete the withdrawal application form, and upload all required documents.
        6. Once approved, download "Bukti Pengajuan Undur Diri". The refund will be transferred after verification by BAK.
      translation:
        id: |
          PROSEDUR UNDUR DIRI CALON MAHASISWA BARU
          1. Login ke portal SPMB Trisakti.
          2. Masuk ke menu "Status Keuangan" dan tekan tab "Payment" untuk memeriksa jumlah pembayaran yang telah dilakukan.
          3. Pilih menu "Undur Diri".
          4. Pilih program studi yang akan diundurdirikan, lalu tekan tombol "Apply Quit".
          5. Isi data rekening pengembalian dana, lengkapi formulir aplikasi undur diri, dan unggah semua dokumen yang diminta.
          6. Setelah disetujui, calon mahasiswa dapat mengunduh "Bukti Pengajuan Undur Diri". Dana pengembalian ditransfer setelah diverifikasi oleh BAK.

  utter_answer_persyaratan_undur_diri:
    - text: |
        WITHDRAWAL REQUIREMENTS
        1. Withdrawal applications must be submitted online by the candidate or their parents no later than August 11, 2026.
        2. Refund of education fees is subject to administrative deductions based on program/faculty:
            - Bachelor of Medicine (FK): IDR 50,000,000
            - Bachelor of Dentistry (FKG): IDR 25,000,000
            - Master and Doctoral programs: IDR 15,000,000
            - Other Bachelor programs (FH, FEB, FTSP, FTI, FTKE, FALTL, FSRD): IDR 10,000,000
            - Diploma programs: IDR 1,000,000
        3. Submissions outside the schedule or after August 11, 2026, are non-refundable for any reason.
      translation:
        id: |
          PERSYARATAN UNDUR DIRI
          1. Pengajuan undur diri dilakukan secara daring (online) oleh calon mahasiswa bersangkutan atau orang tua/wali paling lambat tanggal 11 Agustus 2026.
          2. Pengembalian biaya pendidikan dikenai potongan biaya administrasi sesuai jenjang program/fakultas:
              - Sarjana Kedokteran (FK): Rp50.000.000
              - Sarjana Kedokteran Gigi (FKG): Rp25.000.000
              - Program Magister & Doktor: Rp15.000.000
              - Program Sarjana lainnya (FH, FEB, FTSP, FTI, FTKE, FALTL, FSRD): Rp10.000.000
              - Program Diploma: Rp1.000.000
          3. Pengajuan di luar jadwal dan melebihi batas waktu (setelah 11 Agustus 2026) menyebabkan seluruh biaya pendidikan yang telah dibayarkan tidak dikembalikan dengan alasan apapun.

  utter_answer_transaksi_undur_diri:
    - text: "Please complete the documents and form for your withdrawal application so we can process it."
      translation:
        id: "Silakan lengkapi berkas dan formulir pengajuan undur diri Anda untuk kami proses."

  utter_answer_hasil_undur_diri:
    - text: "Your withdrawal application is currently being processed by academic administration."
      translation:
        id: "Permohonan pengunduran diri Anda sedang diproses oleh admin akademik."

  utter_answer_error_undur_diri:
    - text: "Sorry, an error occurred in the withdrawal menu. Please try again."
      translation:
        id: "Maaf, terjadi kesalahan pada menu undur diri. Silakan coba lagi."
