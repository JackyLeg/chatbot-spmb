version: "3.1"

actions:
  - action_menu_kartu_ujian

slots:
  menu_kartu_ujian:
    type: categorical
    values:
      - Prosedur Kartu Ujian
      - Persyaratan Kartu Ujian
      - Hasil Kartu Ujian
      - Exam Card Procedure
      - Exam Card Requirements
      - Exam Card Status
    mappings:
      - type: from_llm

  menu_kartu_ujian_confirmation:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_menu_kartu_ujian:
    - text: "Please select one of the exam card options:"
      translation:
        id: "Silakan pilih salah satu opsi kartu ujian:"
      buttons:
        - title: "Exam Card Procedure"
          payload: "Exam Card Procedure"
          translation:
            id:
              title: "Prosedur Kartu Ujian"
              payload: "Prosedur Kartu Ujian"
        - title: "Exam Card Requirements"
          payload: "Exam Card Requirements"
          translation:
            id:
              title: "Persyaratan Kartu Ujian"
              payload: "Persyaratan Kartu Ujian"
        - title: "Exam Card Status"
          payload: "Exam Card Status"
          translation:
            id:
              title: "Hasil Kartu Ujian"
              payload: "Hasil Kartu Ujian"

  utter_ask_menu_kartu_ujian_confirmation:
    - text: "You chose option: {menu_kartu_ujian}. Is this correct?"
      translation:
        id: "Anda memilih opsi: {menu_kartu_ujian}. Apakah ini benar?"
      buttons:
        - title: "Yes"
          payload: "Yes"
          translation:
            id:
              title: "Ya"
              payload: "Ya"
        - title: "No"
          payload: "No"
          translation:
            id:
              title: "Tidak"
              payload: "Tidak"

  utter_menu_kartu_ujian_cancelled:
    - text: "Selection cancelled. Please select an exam card option again."
      translation:
        id: "Pilihan dibatalkan. Silakan pilih kembali opsi kartu ujian."

  utter_menu_kartu_ujian_ok:
    - text: "You have selected the exam card option: {menu_kartu_ujian}."
      translation:
        id: "Anda telah memilih opsi kartu ujian: {menu_kartu_ujian}."

  utter_answer_prosedur_kartu_ujian:
    - text: |
        EXAM CARD PRINTING PROCEDURE
        1. Log in to your SPMB Trisakti portal account.
        2. Access the applicant dashboard page once your registration payment status is verified.
        3. Download the exam participant card from the SPMB account dashboard to check the exam schedule and rules.
        4. Participate in the online Entrance Examination (USM) via the SPMB portal on the chosen date.
      translation:
        id: |
          PROSEDUR CETAK KARTU PESERTA UJIAN
          1. Login ke akun portal SPMB Trisakti Anda.
          2. Masuk ke halaman dashboard peserta setelah status pembayaran pendaftaran terverifikasi.
          3. Calon mahasiswa mengunduh kartu peserta ujian dari dashboard akun SPMB untuk melihat jadwal dan ketentuan tes.
          4. Mengikuti Ujian Saringan Masuk (USM) secara daring (online) melalui portal SPMB sesuai tanggal yang dipilih.

  utter_answer_persyaratan_kartu_ujian:
    - text: |
        EXAM CARD REQUIREMENTS
        1. The registration/selection fee payment status is paid and verified in the financial system.
        2. Personal details and required registration forms have been completely filled and confirmed.
        3. Applicants for FK & FKG must undergo additional tests (IST, Psychotest, Biology & Chemistry) organized by the Psychology Bureau/committee.
      translation:
        id: |
          PERSYARATAN KARTU UJIAN
          1. Status pembayaran biaya seleksi/pendaftaran telah lunas dan terverifikasi di sistem keuangan.
          2. Pengisian data personal dan berkas pendaftaran telah lengkap dan terkonfirmasi.
          3. Khusus peminat FK & FKG wajib mengikuti tes tambahan (IST, Psikotes, Biologi & Kimia) yang diselenggarakan oleh Biro Psikologi/panitia.

  utter_answer_hasil_kartu_ujian:
    - text: "Your Exam Card has been issued. Please download it via your SPMB account dashboard."
      translation:
        id: "Kartu Ujian Anda telah diterbitkan. Silakan unduh melalui dashboard akun SPMB Anda."

  utter_answer_error_kartu_ujian:
    - text: "Sorry, an error occurred in the exam card menu. Please try again."
      translation:
        id: "Maaf, terjadi kesalahan pada menu kartu ujian. Silakan coba lagi."
