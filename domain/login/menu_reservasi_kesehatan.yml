version: "3.1"

actions:
  - action_menu_reservasi_kesehatan

slots:
  menu_reservasi_kesehatan:
    type: categorical
    values:
      - Prosedur Reservasi Kesehatan
      - Persyaratan Reservasi Kesehatan
      - Transaksi Reservasi Kesehatan
      - Hasil Reservasi Kesehatan
      - Medical Examination Reservation Procedure
      - Medical Examination Reservation Requirements
      - Medical Examination Reservation Transaction
      - Medical Examination Reservation Status
    mappings:
      - type: from_llm

  menu_reservasi_kesehatan_confirmation:
    type: bool
    mappings:
      - type: from_llm

responses:
  utter_ask_menu_reservasi_kesehatan:
    - text: "Please select one of the medical examination reservation options:"
      translation:
        id: "Silakan pilih salah satu opsi reservasi pemeriksaan kesehatan:"
      buttons:
        - title: "Reservation Procedure"
          payload: "Medical Examination Reservation Procedure"
          translation:
            id:
              title: "Prosedur Reservasi Kesehatan"
              payload: "Prosedur Reservasi Kesehatan"
        - title: "Reservation Requirements"
          payload: "Medical Examination Reservation Requirements"
          translation:
            id:
              title: "Persyaratan Reservasi Kesehatan"
              payload: "Persyaratan Reservasi Kesehatan"
        - title: "Reservation Transaction"
          payload: "Medical Examination Reservation Transaction"
          translation:
            id:
              title: "Transaksi Reservasi Kesehatan"
              payload: "Transaksi Reservasi Kesehatan"
        - title: "Reservation Status"
          payload: "Medical Examination Reservation Status"
          translation:
            id:
              title: "Hasil Reservasi Kesehatan"
              payload: "Hasil Reservasi Kesehatan"

  utter_ask_menu_reservasi_kesehatan_confirmation:
    - text: "You chose option: {menu_reservasi_kesehatan}. Is this correct?"
      translation:
        id: "Anda memilih opsi: {menu_reservasi_kesehatan}. Apakah ini benar?"
      buttons:
        - title: "Yes"
          payload: "Yes"
          translation:
            id:
              title: "Ya"
              payload: "Ya"
        - title: "No"
          payload: "No"
          translation:
            id:
              title: "Tidak"
              payload: "Tidak"

  utter_menu_reservasi_kesehatan_cancelled:
    - text: "Selection cancelled. Please select a medical examination reservation option again."
      translation:
        id: "Pilihan dibatalkan. Silakan pilih kembali opsi reservasi pemeriksaan kesehatan."

  utter_menu_reservasi_kesehatan_ok:
    - text: "You have selected the medical examination reservation option: {menu_reservasi_kesehatan}."
      translation:
        id: "Anda telah memilih opsi reservasi pemeriksaan kesehatan: {menu_reservasi_kesehatan}."

  utter_answer_prosedur_reservasi_kesehatan:
    - text: |
        MEDICAL EXAMINATION PROCEDURE
        1. Candidates undergo a medical examination independently at Klinik Pratama Usakti Prima Medika (UPM), Puskesmas, Clinics, or Hospitals.
        2. Obtain a Health Certificate and a Drug-Free Certificate.
        3. For specific programs, candidates must also undergo a color blindness test to obtain a Non-Color-Blind Certificate.
        4. Scanned color copies (original format PDF/PNG/JPG) of the certificates must be uploaded to the re-registration menu on the SPMB portal.
      translation:
        id: |
          PROSEDUR PEMERIKSAAN KESEHATAN
          1. Calon mahasiswa melakukan pemeriksaan kesehatan secara mandiri di Klinik Pratama Usakti Prima Medika (UPM), Puskesmas, Klinik Utama, atau Rumah Sakit.
          2. Dapatkan Surat Keterangan Sehat dan Surat Keterangan Bebas Narkoba.
          3. Bagi pendaftar program studi tertentu, wajib menyertakan pemeriksaan buta warna untuk mendapatkan Surat Keterangan Tidak Buta Warna.
          4. Hasil pindaian berwarna (scan asli format PDF/PNG/JPG) dari surat-surat tersebut wajib diunggah ke menu kelengkapan registrasi di portal SPMB.

  utter_answer_persyaratan_reservasi_kesehatan:
    - text: |
        MEDICAL EXAMINATION REQUIREMENTS
        1. Health Certificate and Drug-Free Certificate officially issued by a doctor.
        2. Non-Color-Blind Certificate for specific programs under FK, FKG, FSRD, FTKE, FALTL, FTSP, and FTI (Mechanical, Electrical, Industrial Engineering).
        3. Upload all files via the "Update Data Kelengkapan Registrasi" menu no later than August 20, 2026.
      translation:
        id: |
          PERSYARATAN RESERVASI KESEHATAN
          1. Surat Keterangan Sehat dan Bebas Narkoba yang resmi diterbitkan oleh dokter.
          2. Surat Keterangan Tidak Buta Warna bagi program studi di fakultas: FK, FKG, FSRD, FTKE, FALTL, FTSP, dan FTI (Teknik Mesin, Teknik Elektro, Teknik Industri).
          3. Unggah seluruh berkas tersebut melalui menu "Update Data Kelengkapan Registrasi" paling lambat pada tanggal 20 Agustus 2026.

  utter_answer_transaksi_reservasi_kesehatan:
    - text: "Please fill out the form and choose your medical examination reservation schedule."
      translation:
        id: "Silakan isi formulir dan tentukan jadwal reservasi pemeriksaan kesehatan Anda."

  utter_answer_hasil_reservasi_kesehatan:
    - text: "Your medical examination schedule has been confirmed, and results will be sent directly by the referral hospital."
      translation:
        id: "Jadwal pemeriksaan kesehatan Anda telah dikonfirmasi dan hasil tes kesehatan akan dikirimkan langsung oleh RS rujukan."

  utter_answer_error_reservasi_kesehatan:
    - text: "Sorry, an error occurred in the medical examination reservation menu. Please try again."
      translation:
        id: "Maaf, terjadi kesalahan pada menu reservasi kesehatan. Silakan coba lagi."
