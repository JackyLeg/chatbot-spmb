version: "3.1"

actions:
  - action_info_skema_keuangan

responses:
  utter_info_skema_keuangan:
    - text: |
        SPMB FINANCIAL SCHEME INFORMATION
        Admission and tuition fees are determined based on your study program and selected admission path:
        1. Registration Fee: Rp300,000 - Rp750,000 (depending on choice of Saintek/Soshum branch).
        2. Semester 1 Tuition Fee: Consists of the Education Development Contribution (SPP) and credit-based Tuition Fee (BPP).
        3. Universitas Trisakti provides installment options for tuition fees during the first ongoing semester.
      translation:
        id: |
          INFORMASI SKEMA KEUANGAN SPMB
          Biaya pendaftaran dan kuliah ditentukan berdasarkan program studi dan jalur masuk pilihan Anda:
          1. Biaya Pendaftaran: Rp300.000 - Rp750.000 (tergantung pilihan rumpun Saintek/Soshum).
          2. Biaya Kuliah Semester 1: Terdiri dari Sumbangan Pengembangan Pendidikan (SPP) dan Biaya Penyelenggaraan Pendidikan (BPP) SKS.
          3. Universitas Trisakti menyediakan opsi cicilan biaya kuliah selama semester pertama berjalan.
