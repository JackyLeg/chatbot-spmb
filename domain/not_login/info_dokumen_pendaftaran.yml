version: "3.1"

actions:
  - action_info_dokumen_pendaftaran

responses:
  utter_info_dokumen_pendaftaran:
    - text: |
        SPMB ADMISSION DOCUMENT CHECKLIST
        To register, please prepare the following digital documents (scanned):
        1. Photocopy of High School Report Cards Semesters 1-5 (specifically for Report Card/Academic path).
        2. Photocopy of Family Card (KK) and ID Card (KTP) / Student Card.
        3. Color pass photograph sized 3x4 (red/blue background).
        4. Color Blindness Free Certificate (specifically for Medicine, Dentistry, Fine Arts, and Chemical Engineering).
      translation:
        id: |
          KELENGKAPAN DOKUMEN PENDAFTARAN SPMB
          Untuk melakukan pendaftaran, siapkan dokumen digital (scan) berikut:
          1. Fotokopi Rapor Semester 1-5 (khusus Jalur Rapor/Prestasi).
          2. Fotokopi Kartu Keluarga (KK) dan KTP/Kartu Pelajar.
          3. Pas foto berwarna ukuran 3x4 (latar belakang merah/biru).
          4. Surat Keterangan Tidak Buta Warna (khusus prodi Kedokteran, Kedokteran Gigi, Seni Rupa, dan Teknik Kimia).
